[project]
name = "rag-agent-eval"
version = "0.1.0"
description = "RAG Q&A Agent with Evaluation & Observability — a demo project showcasing how to build, evaluate, and observe a RAG pipeline end-to-end."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # LLM
    "anthropic>=1.0.0",
    "google-genai>=1.0.0",

    # RAG pipeline
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",

    # Document processing
    "langchain-text-splitters>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.14.0",

    # Config & utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
azure = [
    "openai>=1.50.0",
]
ui = [
    "streamlit>=1.38.0",
]

[project.scripts]
rag = "rag_agent_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
